version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mockbees
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mockbees
      - SECRET_KEY=changeme
      - GROQ_API_KEY=changeme
    ports:
      - '8000:8000'
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  db_data:
