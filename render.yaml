services:
  - type: web
    name: mockbees-backend
    env: python
    plan: starter
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./mockbees.db"
      - key: SECRET_KEY
        value: "replace-with-secure-secret"
      - key: GROQ_API_KEY
        value: "replace-with-groq-api-key"
      - key: GOOGLE_CLIENT_ID
        value: "replace-with-google-client-id"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
    autoDeploy: true

  - type: static
    name: mockbees-frontend
    env: static
    plan: starter
    buildCommand: "cd frontend && npm install && npm run build"
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "https://mockbees-backend.onrender.com/api"
    autoDeploy: true
